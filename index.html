<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>English Movies</title>
  <link rel="manifest" href="manifest.json">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:     #0a0a0a;
      --surface:#141414;
      --border: #1e1e1e;
      --text:   #e8e8e8;
      --muted:  #555;
      --accent: #e8b84b;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
    }

    header {
      padding: 52px 20px 28px;
    }

    header h1 {
      font-size: 28px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.5px;
    }

    header p {
      font-size: 14px;
      color: var(--muted);
      margin-top: 6px;
    }

    .section-title {
      padding: 4px 20px 12px;
      font-size: 11px;
      font-weight: 700;
      color: #333;
      text-transform: uppercase;
      letter-spacing: 1.2px;
    }

    .movies {
      padding: 0 16px 40px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .movie-card {
      background: var(--surface);
      border-radius: 14px;
      padding: 18px 16px 18px 18px;
      text-decoration: none;
      color: inherit;
      display: flex;
      align-items: center;
      gap: 16px;
      border: 1px solid var(--border);
      transition: background 0.12s;
    }

    .movie-card:active { background: #1a1a1a; }

    .movie-icon {
      width: 48px;
      height: 48px;
      border-radius: 10px;
      background: #1e1a0e;
      border: 1px solid #2a2010;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .movie-icon svg { width: 22px; height: 22px; fill: var(--accent); opacity: 0.8; }

    .movie-info { flex: 1; min-width: 0; }

    .movie-info h2 {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
    }

    .movie-info p {
      font-size: 12px;
      color: var(--muted);
      margin-top: 3px;
    }

    .movie-lines {
      font-size: 12px;
      color: #383828;
      margin-top: 6px;
      font-weight: 500;
    }

    .movie-lines.loaded { color: var(--accent); }

    .chevron {
      color: #252525;
      font-size: 20px;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <header>
    <h1>English Movies</h1>
    <p>Study real movie scripts with grammar and phonetics</p>
  </header>

  <div class="section-title">Available</div>

  <div class="movies" id="movies-list">
    <a href="viewer.html?movie=patch_adams" class="movie-card" id="card-patch_adams">
      <div class="movie-icon">
        <svg viewBox="0 0 24 24"><path d="M18 4H6C4.9 4 4 4.9 4 6v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm-2 10.5v-5l4 2.5-4 2.5z"/></svg>
      </div>
      <div class="movie-info">
        <h2>Patch Adams</h2>
        <p>1998 · Drama · Robin Williams</p>
        <div class="movie-lines" id="lines-patch_adams">Loading...</div>
      </div>
      <span class="chevron">›</span>
    </a>
  </div>

  <script>
    const movies = ['patch_adams'];

    movies.forEach(async id => {
      try {
        const res  = await fetch(`data/${id}.json`);
        const data = await res.json();
        const el   = document.getElementById('lines-' + id);
        if (el) {
          el.textContent = `${data.lines.length.toLocaleString()} lines`;
          el.classList.add('loaded');
        }
      } catch {}
    });
  </script>
</body>
</html>
